body.focus header,body.focus .side,body.focus .bar,body.focus #saved{display:none!important}body.focus .wrap{padding:0}body.focus .board{min-width:0;aspect-ratio:auto;height:100vh;border-radius:0;border:0}body.focus .scr{border-radius:0;overflow:auto}body.focus #xf{display:block}

 return{collection:c=>({

function noteHTML(k,n){const c=cur==="stake"?(ST[n.s]||ST.viewers)[1]:COL[n.c||0];
  const w=n.w!=null?n.w:13.5,h=n.h!=null?n.h:12;
  return `<div class="n ${sel===k?"sel":""}" data-k="${k}" style="left:${n.x}%;top:${n.y}%;width:${w}%;min-width:0;height:${h}%;background:${c}"><div class="h" onpointerdown="drag(event,'${k}')"><i>${esc(n.by||"")}</i><span onclick="cyc('${k}')" title="Color">🎨</span><span onclick="pick('${k}')" title="Relacionar">🔗</span><span onclick="attach('${k}')" title="Adjuntar">📎</span><span onclick="delNote('${k}')">✕</span><span class="sizeBtn" title="Reducir tamaño" onclick="sizeNote('${k}',-1);event.stopPropagation()">−</span><span class="sizeBtn" title="Aumentar tamaño" onclick="sizeNote('${k}',1);event.stopPropagation()">+</span><span class="resizeBtn" title="Arrastra para cambiar tamaño" onpointerdown="resizeStart(event,'${k}')">↘</span></div><textarea onchange="upd('${k}',this.value)" placeholder="Escribe…">${esc(n.t)}</textarea>${n.f?`<a href="${esc(n.f)}" target="_blank">📎 ${esc(n.fn||"archivo")}</a>`:""}<span class="rs" title="Arrastra para cambiar tamaño" onpointerdown="resizeStart(event,'${k}')">↘</span></div>`}
function ref(k){return db.collection("n-"+cur).doc(k)}
function addStake(e){e.preventDefault();const k=uid();notes[k]={t:$("#sn").value,s:$("#ss").value,x:null,y:null,by:me.name};safe(()=>ref(k).set(notes[k]));draw()}
function addNote(i){const z=i==null?{x:30,y:30,w:20,h:20}:T[cur].z[i];const k=uid();
  const n={t:"",c:Math.floor(Math.random()*5),x:+(z.x+3+Math.random()*Math.max(1,z.w-18)).toFixed(1),y:+(z.y+9+Math.random()*Math.max(1,z.h-26)).toFixed(1),w:13.5,h:12,by:me.name};
  if(cur==="stake"){n.s="viewers"}
  notes[k]=n;draw();if(db)safe(()=>ref(k).set(n))}
function upd(k,t){notes[k].t=t;if(db)safe(()=>ref(k).update({t}))}
function cyc(k){const n=notes[k];if(cur==="stake"){const o=Object.keys(ST);n.s=o[(o.indexOf(n.s||"viewers")+1)%3];safe(()=>ref(k).update({s:n.s}))}else{n.c=((n.c||0)+1)%5;safe(()=>ref(k).update({c:n.c}))}draw()}
function delNote(k){delete notes[k];Object.entries(links).forEach(([id,l])=>{if(l.a===k||l.b===k)safe(()=>db.collection("l-"+cur).doc(id).delete())});safe(()=>ref(k).delete());draw()}
function drag(e,k){if(e.target.tagName==="SPAN"||e.target.classList.contains("rs"))return;const bd=$("#bd"),el=e.currentTarget.parentElement,r=bd.getBoundingClientRect();
  const w=(notes[k].w!=null?notes[k].w:13.5),h=(notes[k].h!=null?notes[k].h:12);
  const ox=e.clientX-el.offsetLeft,oy=e.clientY-el.offsetTop;el.setPointerCapture?.(e.pointerId);e.currentTarget.setPointerCapture(e.pointerId);
  const mv=ev=>{const maxX=Math.max(0,100-w),maxY=Math.max(0,100-h);const x=Math.max(0,Math.min(maxX,(ev.clientX-ox)/r.width*100)),y=Math.max(0,Math.min(maxY,(ev.clientY-oy)/r.height*100));el.style.left=x+"%";el.style.top=y+"%";notes[k].x=+x.toFixed(1);notes[k].y=+y.toFixed(1);drawLinks()};
  const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);safe(()=>ref(k).update({x:notes[k].x,y:notes[k].y}))};
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up)}
function sizeNote(k,delta){
  const n=notes[k]; if(!n)return;
  const step=2, min=8, maxW=Math.max(min,100-(n.x||0)), maxH=Math.max(min,100-(n.y||0));
  const oldW=n.w!=null?n.w:13.5, oldH=n.h!=null?n.h:12;
  n.w=+Math.min(maxW,Math.max(min,oldW+delta*step)).toFixed(1);
  n.h=+Math.min(maxH,Math.max(min,oldH+delta*step)).toFixed(1);
  const el=document.querySelector(`.n[data-k="${k}"]`);
  if(el){el.style.width=n.w+'%';el.style.height=n.h+'%';el.classList.add('resizing');setTimeout(()=>el.classList.remove('resizing'),180)}
  drawLinks();
  if(db)safe(()=>ref(k).update({w:n.w,h:n.h}));
}
function resizeStart(e,k){
  e.preventDefault();e.stopPropagation();
  const el=e.currentTarget.closest('.n'),bd=$("#bd"),r=bd.getBoundingClientRect(),n=notes[k];
  const startX=e.clientX,startY=e.clientY,startW=n.w!=null?n.w:13.5,startH=n.h!=null?n.h:12;
  el.classList.add('resizing');
  const mv=ev=>{
    ev.preventDefault();
    const maxW=Math.max(8,100-(n.x||0)),maxH=Math.max(8,100-(n.y||0));
    n.w=+Math.min(maxW,Math.max(8,startW+(ev.clientX-startX)/r.width*100)).toFixed(1);
    n.h=+Math.min(maxH,Math.max(8,startH+(ev.clientY-startY)/r.height*100)).toFixed(1);
    el.style.width=n.w+'%';el.style.height=n.h+'%';drawLinks();
  };
  const up=()=>{el.classList.remove('resizing');window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);if(db)safe(()=>ref(k).update({w:n.w,h:n.h}));};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){ }
}
function toggleLink(){linkMode=!linkMode;pend=[];$("#lk").style.background=linkMode?"var(--pri)":"";$("#lk").style.color=linkMode?"#fff":"";lbar()}
function pick(k){if(!linkMode)toggleLink();if(!pend.includes(k))pend.push(k);pend=pend.slice(-2);sel=k;lbar()}
function lbar(){const b=$("#lb");if(!b)return;b.innerHTML=linkMode?(pend.length<2?`<span class="ok">Pulsa 🔗 en dos post-its para relacionarlos (${pend.length}/2)</span>`:`<input id="ld" placeholder="Describe la relación"><button onclick="mkLink()">Crear relación</button>`):""}
function mkLink(){const d=$("#ld").value||"relación";const id=uid();const l={a:pend[0],b:pend[1],d};links[id]=l;safe(()=>db.collection("l-"+cur).doc(id).set(l));toggleLink();drawLinks()}
function drawLinks(){const sv=$("#sv"),lt=$("#lt");if(!sv)return;let s="",h="";
  Object.entries(links).forEach(([id,l])=>{const a=notes[l.a],b=notes[l.b];if(!a||!b||a.x==null||b.x==null)return;
    const x1=a.x+(a.w!=null?a.w/2:6.75),y1=a.y+(a.h!=null?a.h/2:6),x2=b.x+(b.w!=null?b.w/2:6.75),y2=b.y+(b.h!=null?b.h/2:6);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2f6f4a" stroke-width=".35" stroke-dasharray="1 .6"/>`;
    h+=`<div class="lt" style="left:${(x1+x2)/2}%;top:${(y1+y2)/2}%" title="Clic para eliminar" onclick="dl('${id}')">${esc(l.d)}</div>`});
  sv.innerHTML=s;lt.innerHTML=h}
function dl(id){delete links[id];safe(()=>db.collection("l-"+cur).doc(id).delete());drawLinks()}
function attach(k){if(!sb)return alert("Configura Supabase para subir archivos.");
  const i=document.createElement("input");i.type="file";i.onchange=async()=>{const f=i.files[0];if(!f)return;
    const p=cur+"/"+uid()+"-"+f.name.replace(/[^\w.-]/g,"_");const r=await sb.storage.from("adjuntos").upload(p,f);
    if(r.error)return alert("Error al subir: "+r.error.message);const u=sb.storage.from("adjuntos").getPublicUrl(p).data.publicUrl;
    notes[k].f=u;notes[k].fn=f.name;safe(()=>ref(k).update({f:u,fn:f.name}));draw()};i.click()}
function saveShare(){safe(()=>db.collection("meta").doc(cur).set({saved:true,by:me.name,at:Date.now()}))}
init();
</script></body></html>
